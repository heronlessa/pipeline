name: "1. Quality Gate com IA"

on:
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pytest pytest-cov

      - name: Executar testes com cobertura
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --ignore=src/ai_agent.py 2>&1 | tee coverage_output.txt
          COVERAGE=$(python -c "
import re
content = open('coverage_output.txt').read()
match = re.search(r'src/app\.py\s+\d+\s+\d+\s+(\d+)%', content)
print(match.group(1) if match else '0')
")
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
          echo "Cobertura obtida: $COVERAGE%"

      - name: Agente IA — Analisar qualidade
        run: |
          echo "Agente de Testes analisando cobertura de ${{ env.COVERAGE }}%..."
          python src/ai_agent.py qualidade ${{ env.COVERAGE }}

      - name: Resultado do Quality Gate
        run: echo "Quality Gate APROVADO — deploy liberado"
