name: "1. Quality Gate com IA"

on:
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pytest pytest-cov

      - name: Executar testes com cobertura
        run: pytest tests/ --cov=src/app --cov-report=term-missing 2>&1 | tee coverage_output.txt

      - name: Extrair cobertura
        run: |
          grep "src/app.py" coverage_output.txt | awk '{print $NF}' | tr -d '%' > cobertura.txt
          cat cobertura.txt
          echo "COVERAGE=$(cat cobertura.txt)" >> $GITHUB_ENV

      - name: Agente IA — Analisar qualidade
        run: python src/ai_agent.py qualidade ${{ env.COVERAGE }}

      - name: Quality Gate aprovado
        run: echo "Deploy liberado com cobertura de ${{ env.COVERAGE }}%"
