name: "2. Observabilidade Inteligente"

on:
  push:
    branches: [main]

jobs:
  analisar-logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Agente IA — Analisar logs
        run: python src/ai_agent.py logs logs/app.log

      - name: Criar issue simulada se erro critico
        run: |
          python src/ai_agent.py logs logs/app.log > resultado.json 2>/dev/null || true
          CRIAR=$(python -c "import json; d=json.load(open('resultado.json')); print(d.get('criar_issue', False))")
          if [ "$CRIAR" = "True" ]; then
            echo "Issue criada: Erros criticos detectados nos logs!"
          else
            echo "Nenhum erro critico. Issue nao necessaria."
          fi

  analisar-metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Agente IA — Analisar metricas
        run: python src/ai_agent.py metricas metrics/metrics.json || true

  analisar-traces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Agente IA — Analisar traces
        run: python src/ai_agent.py traces traces/trace.txt
