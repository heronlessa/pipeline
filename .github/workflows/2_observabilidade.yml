name: "2. Observabilidade Inteligente"

on:
  push:
    branches: [main]

jobs:
  analisar-logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Agente IA — Analisar logs
        run: |
          echo "🤖 Agente de Incidente analisando logs..."
          python src/ai_agent.py logs logs/app.log

      - name: Criar issue simulada se erro crítico
        run: |
          python src/ai_agent.py logs logs/app.log > resultado.json 2>/dev/null || true
          python -c "
import json
data = json.load(open('resultado.json'))
if data.get('criar_issue'):
    print('Issue criada: Erros criticos detectados nos logs!')
else:
    print('Nenhum erro critico. Issue nao necessaria.')
"

  analisar-metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Agente IA — Analisar metricas
        run: |
          echo "🤖 Agente de Custo analisando metricas do sistema..."
          python src/ai_agent.py metricas metrics/metrics.json || true

  analisar-traces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Agente IA — Analisar traces
        run: |
          echo "🤖 Agente de Deploy analisando trace distribuido..."
          python src/ai_agent.py traces traces/trace.txt
